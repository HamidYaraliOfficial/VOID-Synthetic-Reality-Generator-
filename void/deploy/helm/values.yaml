api:
  image: void-api:local
  replicaCount: 2
  port: 8080
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 2Gi }
  env:
    VOID_WORKER_COUNT: "8"
    VOID_CORS_ORIGIN: "http://localhost:3000"

dashboard:
  image: void-dashboard:local
  replicaCount: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

secrets:
  jwtSecret: "change-me-in-production"
  postgresDSN: ""
  redisAddr: ""
  natsURL: ""
